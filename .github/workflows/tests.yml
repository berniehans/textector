name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Entorno
        run: uv sync
      - name: Tests (stdlib unittest)
        run: uv run python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI smoke
        run: uv run python tools/cli.py analyze --archivo corpus/human/h01.txt --diagnostico
