  - "más importante que nunca|30|inspiracion-tematica::fiction::more-important-than-ever"
  - "sin lugar a dudas|20|es-nativo"
  - "no cabía duda|20|es-nativo"
  - "la puerta se abrió de par en par|15|inspiracion-tematica::fiction::door-swing-open"
  - "sus labios se curvaron|30|inspiracion-tematica::fiction::lips-curve"
  - "una mezcla de __ y __|20|inspiracion-tematica::fiction::mixture-of-fear-love"
