# Léxico de clichés IA en español — textector F2.
# Formato YAML-min fail-closed (parser: tools/lexicon.py; spec: tests/test_yaml_lexicon.py).
# - version: entero de formato del archivo.
# - phrases: clave legacy del esqueleto F1; se conserva VACÍA porque el test
#   del esqueleto (test_config_real_parsea) fija ese contrato y el léxico
#   poblado de F2 vive en la clave raíz `cliches` (ver docs/methodology.md).
# - cliches: entradas "frase|peso|fuente" (escalar double-quoted estilo JSON).
#   peso 0..100 estilo corpus AIStoryHub (provisional: congelado en F2;
#   ni F3 ni F6 recalibran pesos — la calibración solo ajusta umbral y
#   margen. Recalibrar pesos exige decisión explícita (F8d) y holdout
#   nuevo). "__" = comodín: coincide con EXACTAMENTE
#   un token cualquiera.
# Fuentes citadas por entrada:
#   inspiracion-tematica::<slug> = inspiración temática en las categorías de
#                  AStoryHub Corpus of AI Cliches v1.7 (Jean-Philippe
#                  LeBlanc, 2025; MIT). Adaptación manual al ES: NO es
#                  traducción 1:1 ni cotejo entrada por entrada (ver el cotejo
#                  histórico en docs/cotejo-aistoryhub.md).
#   es-nativo    = señal narrativa española propia, revisión manual F2.
version: 1

phrases: []

cliches:
  - "en un mundo donde|45|inspiracion-tematica::fiction::world-of"
  - "sumérgete en|40|inspiracion-tematica::fiction::immerse"
