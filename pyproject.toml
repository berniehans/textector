[project]
name = "textector"
version = "0.1.0"
description = "Clique heurístico explicable (indice_llm) de señales asociadas a texto generado por LLM, en español. Indicio, no probabilidad ni prueba de autoría."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
