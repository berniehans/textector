[project]
name = "textector"
version = "0.1.0"
description = "Índice heurístico explicable (indice_llm) de señales asociadas a texto generado por LLM, en español. Indicio, no probabilidad ni prueba de autoría."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bernie Hans Benitez Altamirano" }]
keywords = ["deteccion-ia", "texto", "espanol", "cli", "stdlib", "forense"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/berniehans/textector"
Repository = "https://github.com/berniehans/textector"

[project.scripts]
textector = "tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
